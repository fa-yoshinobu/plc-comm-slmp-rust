name: ci

on:
  push:
  pull_request:

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Check the published crate on its declared minimum Rust version
        run: cargo check -p plc-comm-slmp --all-targets --all-features

  rust-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: plc-comm-slmp-rust

      - name: Check release workflows do not auto-publish
        working-directory: plc-comm-slmp-rust
        shell: pwsh
        run: ./scripts/check_no_auto_publish.ps1
      - name: Check canonical SLMP profile JSONs
        working-directory: plc-comm-slmp-rust
        shell: pwsh
        run: ./scripts/update_slmp_profile_jsons.ps1 -FailIfChanged

      - uses: dtolnay/rust-toolchain@stable

      - name: Cargo fmt
        working-directory: plc-comm-slmp-rust
        run: cargo fmt --all --check

      - name: Cargo clippy
        working-directory: plc-comm-slmp-rust
        run: cargo clippy --all-targets --features cli -- -D warnings

      - name: Cargo test
        working-directory: plc-comm-slmp-rust
        run: cargo test

      - name: Check napi crate
        working-directory: plc-comm-slmp-rust
        run: cargo check -p slmp-node

      - name: Validate crate contents
        working-directory: plc-comm-slmp-rust
        shell: pwsh
        run: ./scripts/check_package_contents.ps1

      - name: Verify self-contained source archive
        working-directory: plc-comm-slmp-rust
        shell: pwsh
        run: ./scripts/check_source_archive.ps1
