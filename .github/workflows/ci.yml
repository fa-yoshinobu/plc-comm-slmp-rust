name: ci

on:
  push:
  pull_request:

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Check the published crate on its declared minimum Rust version
        run: cargo check -p plc-comm-slmp --all-targets --all-features

  rust-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: plc-comm-slmp-rust

      - name: Check release workflows do not auto-publish
        working-directory: plc-comm-slmp-rust
        shell: pwsh
        run: ./scripts/check_no_auto_publish.ps1
      - name: Check canonical SLMP profile JSONs
        working-directory: plc-comm-slmp-rust
        shell: pwsh
        run: ./scripts/update_slmp_profile_jsons.ps1 -FailIfChanged

      - uses: dtolnay/rust-toolchain@stable

      - name: Cargo fmt
        working-directory: plc-comm-slmp-rust
        run: cargo fmt --all --check

      - name: Cargo clippy
        working-directory: plc-comm-slmp-rust
        run: cargo clippy --all-targets --features cli -- -D warnings

      - name: Cargo test
        working-directory: plc-comm-slmp-rust
        run: cargo test

      - name: Check napi crate
        working-directory: plc-comm-slmp-rust
        run: cargo check -p slmp-node

      - name: Validate crate contents
        working-directory: plc-comm-slmp-rust
        shell: pwsh
        run: ./scripts/check_package_contents.ps1

  windows-contract-smoke:
    name: Windows representative contract smoke
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Check refused connection classification
        run: cargo test candidate_exhaustion_before_deadline_is_transport_not_timeout

      - name: Check segmented receive absolute deadline
        run: cargo test --test response_correlation segmented_tcp_response_assembly_does_not_restart_the_deadline

      - name: Check cancellation transport retirement
        run: cargo test --test cancellation externally_cancelled_exchange_closes_transport

      - name: Check close retirement of active and queued work
        run: cargo test --test overhaul_contracts close_rejects_active_write_as_unknown_and_queued_read_without_sending

      - name: Check timeout retirement before reconnect
        run: cargo test --test route_guards udp_timeout_closes_transport_before_another_request

      - name: Check delayed data cannot leak into a new session
        run: cargo test --test response_correlation saturated_foreign_route_flood_cannot_starve_deadline_or_leak_to_new_session
